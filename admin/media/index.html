<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Management — TVS Sensing Solutions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/admin/admin.css">
    <script src="/admin/admin-layout.js"></script>
</head>
<body class="admin-body">

    <div class="admin-layout">
        <!-- Sidebar placeholder -->
        <div id="adminSidebarWrap"></div>

        <div class="admin-main">
            <!-- Topbar placeholder -->
            <div id="adminTopbarWrap"></div>

            <main class="admin-content">

                <!-- Page Header Title & + Add Media Button -->
                <div class="page-header-box">
                    <div>
                        <h1 class="page-title">Media Management</h1>
                        <p class="page-subtitle">Add, edit and manage media content for the website.</p>
                    </div>
                    <a href="/admin/media/new.html" class="btn-primary-blue">+ Add Media</a>
                </div>

                <!-- Media Table Card -->
                <div class="admin-card-container">
                    <!-- Search & Filter Bar -->
                    <div class="search-filter-row">
                        <div class="search-input-wrap">
                            <svg class="search-input-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            <input type="text" id="mediaSearch" class="admin-search-input" placeholder="Search by title or description...">
                        </div>
                        <div class="filter-group-right">
                            <select id="filterType" class="admin-select-filter">
                                <option value="all">All Types</option>
                                <option value="Image">Image</option>
                                <option value="Video">Video</option>
                                <option value="ExternalLink">External Link</option>
                            </select>
                            <select id="filterStatus" class="admin-select-filter">
                                <option value="all">All Status</option>
                                <option value="published">Published</option>
                                <option value="unpublished">Unpublished</option>
                            </select>
                            <input type="date" id="filterDate" class="admin-select-filter" style="color: #64748B;">
                        </div>
                    </div>

                    <!-- Table Wrap -->
                    <div class="table-wrap">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th style="width: 40px;">#</th>
                                    <th>Title</th>
                                    <th>Type</th>
                                    <th>Publish Date</th>
                                    <th>Status</th>
                                    <th style="text-align: right;">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="tblMediaList">
                                <tr><td colspan="6" style="text-align: center; color: #94A3B8; padding: 20px;">Loading media items...</td></tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination Row -->
                    <div class="pagination-row">
                        <div id="pagText">Showing 1 to 5 of 5 entries</div>
                        <div class="pagination-pages" id="pagButtons">
                            <button type="button" class="page-btn active">1</button>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- View Modal -->
    <div id="viewMediaModal" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.6); z-index:999; align-items:center; justify-content:center;">
        <div style="background:#fff; border-radius:12px; padding:24px; max-width:560px; width:90%;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <h3 style="font-family:'Outfit',sans-serif; font-size:1.2rem; font-weight:700; color:#0B192C;" id="viewModalTitle">Media Item</h3>
                <button type="button" onclick="closeViewModal()" style="background:none; border:none; font-size:1.2rem; cursor:pointer; color:#64748B;">&times;</button>
            </div>
            <div id="viewModalBody" style="font-size:0.9rem; color:#334155; line-height:1.6;"></div>
            <div style="text-align:right; margin-top:20px;">
                <button type="button" onclick="closeViewModal()" class="btn-secondary-white">Close</button>
            </div>
        </div>
    </div>

    <script>
        var allMediaItems = [];

        document.addEventListener('DOMContentLoaded', function () {
            window.renderAdminLayout('media', 'Media Management');
            loadMediaData();

            document.getElementById('mediaSearch').addEventListener('input', applyFilters);
            document.getElementById('filterType').addEventListener('change', applyFilters);
            document.getElementById('filterStatus').addEventListener('change', applyFilters);
            document.getElementById('filterDate').addEventListener('change', applyFilters);
        });

        async function loadMediaData() {
            try {
                var response = await fetch(window.TVSS_API.baseUrl + '/media', {
                    headers: window.TVSS_API.getHeaders()
                });
                await window.TVSS_API.checkResponse(response);
                if (!response.ok) throw new Error('Failed to fetch media');
                allMediaItems = await response.json();
                applyFilters();
            } catch (err) {
                console.error('Error loading media:', err);
                document.getElementById('tblMediaList').innerHTML = '<tr><td colspan="6" style="text-align: center; color: #EF4444; padding: 24px;">Unable to load media items. Please check backend connection.</td></tr>';
            }
        }

        function applyFilters() {
            var searchVal = document.getElementById('mediaSearch').value.toLowerCase().trim();
            var typeVal = document.getElementById('filterType').value;
            var statusVal = document.getElementById('filterStatus').value;
            var dateVal = document.getElementById('filterDate').value;

            var filtered = allMediaItems.filter(function (m) {
                var matchSearch = !searchVal || m.title.toLowerCase().includes(searchVal) || (m.shortDescription && m.shortDescription.toLowerCase().includes(searchVal));
                var matchType = typeVal === 'all' || m.mediaType.toLowerCase() === typeVal.toLowerCase();
                var matchStatus = statusVal === 'all' || (statusVal === 'published' && m.isPublished) || (statusVal === 'unpublished' && !m.isPublished);
                var matchDate = !dateVal || (m.publishDate && m.publishDate.startsWith(dateVal));
                return matchSearch && matchType && matchStatus && matchDate;
            });

            renderMediaTable(filtered);
        }

        function renderMediaTable(items) {
            var tbody = document.getElementById('tblMediaList');
            document.getElementById('pagText').textContent = 'Showing 1 to ' + items.length + ' of ' + items.length + ' entries';

            if (items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #94A3B8; padding: 24px;">No media items found matching criteria.</td></tr>';
                return;
            }

            tbody.innerHTML = items.map(function (m, idx) {
                var statusBadge = m.isPublished ? '<span class="badge-status published">Published</span>' : '<span class="badge-status unpublished">Unpublished</span>';
                var typeIcon = getTypeIcon(m.mediaType);
                var dateStr = formatDate(m.publishDate);
                var thumb = m.thumbnailPath || m.filePath || '/1.jpg';

                return '<tr>' +
                    '<td>' + (idx + 1) + '</td>' +
                    '<td>' +
                        '<div style="display: flex; align-items: center; gap: 12px;">' +
                            '<img src="' + thumb + '" class="recent-thumb" onerror="this.src=\'/1.jpg\'" alt="media">' +
                            '<span style="font-weight: 600; color: #0B192C;">' + escapeHtml(m.title) + '</span>' +
                        '</div>' +
                    '</td>' +
                    '<td><div style="display: flex; align-items: center; gap: 6px; font-weight: 500;">' + typeIcon + '<span>' + escapeHtml(m.mediaType) + '</span></div></td>' +
                    '<td>' + dateStr + '</td>' +
                    '<td>' + statusBadge + '</td>' +
                    '<td style="text-align: right;">' +
                        '<div class="action-btn-group" style="justify-content: flex-end;">' +
                            '<button type="button" class="icon-action-btn" title="View" onclick="viewMedia(' + m.id + ')">' +
                                '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>' +
                            '</button>' +
                            '<a href="/admin/media/edit.html?id=' + m.id + '" class="icon-action-btn" title="Edit">' +
                                '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>' +
                            '</a>' +
                            '<label class="toggle-switch" title="Toggle Publish Status">' +
                                '<input type="checkbox" ' + (m.isPublished ? 'checked' : '') + ' onchange="togglePublish(' + m.id + ', this.checked)">' +
                                '<span class="slider-round"></span>' +
                            '</label>' +
                            '<button type="button" class="icon-action-btn delete" title="Delete" onclick="deleteMedia(' + m.id + ')">' +
                                '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>' +
                            '</button>' +
                        '</div>' +
                    '</td>' +
                '</tr>';
            }).join('');
        }

        function getTypeIcon(type) {
            if (type === 'Video') {
                return '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>';
            } else if (type === 'ExternalLink') {
                return '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>';
            }
            return '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>';
        }

        async function togglePublish(id, isPublished) {
            try {
                var endpoint = isPublished ? '/publish' : '/unpublish';
                var response = await fetch(window.TVSS_API.baseUrl + '/media/' + id + endpoint, {
                    method: 'PATCH',
                    headers: window.TVSS_API.getHeaders()
                });
                if (!response.ok) throw new Error('Failed to update status');
                loadMediaData();
            } catch (err) {
                alert('Error updating status: ' + err.message);
                loadMediaData();
            }
        }

        async function deleteMedia(id) {
            if (!confirm('Are you sure you want to delete this media item?')) return;
            try {
                var response = await fetch(window.TVSS_API.baseUrl + '/media/' + id, {
                    method: 'DELETE',
                    headers: window.TVSS_API.getHeaders()
                });
                if (!response.ok) throw new Error('Failed to delete media');
                loadMediaData();
            } catch (err) {
                alert('Error deleting item: ' + err.message);
            }
        }

        function viewMedia(id) {
            var item = allMediaItems.find(function(m) { return m.id === id; });
            if (!item) return;
            document.getElementById('viewModalTitle').textContent = item.title;
            document.getElementById('viewModalBody').innerHTML =
                '<p style="margin-bottom:12px;"><strong>Description:</strong> ' + escapeHtml(item.shortDescription || 'N/A') + '</p>' +
                '<p style="margin-bottom:12px;"><strong>Type:</strong> ' + escapeHtml(item.mediaType) + '</p>' +
                '<p style="margin-bottom:12px;"><strong>Publish Date:</strong> ' + formatDate(item.publishDate) + '</p>' +
                '<p style="margin-bottom:12px;"><strong>Status:</strong> ' + (item.isPublished ? 'Published' : 'Unpublished') + '</p>' +
                (item.externalLink ? '<p><strong>External Link:</strong> <a href="' + escapeHtml(item.externalLink) + '" target="_blank" style="color:#0066FF;">' + escapeHtml(item.externalLink) + '</a></p>' : '');
            document.getElementById('viewMediaModal').style.display = 'flex';
        }

        function closeViewModal() {
            document.getElementById('viewMediaModal').style.display = 'none';
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            var d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
        }
    </script>
</body>
</html>
