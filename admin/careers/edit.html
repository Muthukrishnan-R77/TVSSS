<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Job Opening — TVS Sensing Solutions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/admin/admin.css">
    <script src="/admin/admin-layout.js"></script>
</head>
<body class="admin-body">

    <div class="admin-layout">
        <!-- Sidebar placeholder -->
        <div id="adminSidebarWrap"></div>

        <div class="admin-main">
            <!-- Topbar placeholder -->
            <div id="adminTopbarWrap"></div>

            <main class="admin-content">

                <!-- Page Header Title -->
                <div class="page-header-box">
                    <div>
                        <h1 class="page-title">Edit Job Opening</h1>
                        <p class="page-subtitle">Update job opening information.</p>
                    </div>
                </div>

                <!-- Form Card -->
                <div class="admin-card-container admin-card-inner-padding">
                    <form id="editCareerForm">
                        <div class="form-2col-grid">
                            <!-- Left Column -->
                            <div>
                                <div class="form-group-item">
                                    <label for="jobTitle">Job Title *</label>
                                    <input type="text" id="jobTitle" class="form-input-text" required>
                                </div>

                                <div class="form-group-item">
                                    <label for="department">Department *</label>
                                    <select id="department" class="form-select-box" required>
                                        <option value="">Select department</option>
                                        <option value="Engineering & R&D">Engineering & R&D</option>
                                        <option value="Manufacturing & Quality">Manufacturing & Quality</option>
                                        <option value="Information Technology">Information Technology</option>
                                        <option value="Sales & Marketing">Sales & Marketing</option>
                                        <option value="Human Resources">Human Resources</option>
                                        <option value="Supply Chain & Procurement">Supply Chain & Procurement</option>
                                    </select>
                                </div>

                                <div class="form-group-item">
                                    <label for="location">Location *</label>
                                    <input type="text" id="location" class="form-input-text" required>
                                </div>

                                <div class="form-group-item">
                                    <label for="employmentType">Employment Type *</label>
                                    <select id="employmentType" class="form-select-box" required>
                                        <option value="Full Time">Full Time</option>
                                        <option value="Part Time">Part Time</option>
                                        <option value="Contract">Contract</option>
                                        <option value="Internship">Internship</option>
                                    </select>
                                </div>

                                <div class="form-group-item">
                                    <label for="experienceRequired">Experience Required</label>
                                    <input type="text" id="experienceRequired" class="form-input-text">
                                </div>

                                <div class="form-group-item">
                                    <label for="numberOfVacancies">Number of Vacancies *</label>
                                    <input type="number" id="numberOfVacancies" class="form-input-text" min="1" required>
                                </div>

                                <div class="form-group-item">
                                    <label for="applicationDeadline">Application Deadline</label>
                                    <input type="date" id="applicationDeadline" class="form-input-text">
                                </div>

                                <div class="form-group-item">
                                    <label for="statusSelect">Status *</label>
                                    <select id="statusSelect" class="form-select-box" required>
                                        <option value="true">Active</option>
                                        <option value="false">Closed</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Right Column -->
                            <div>
                                <div class="form-group-item">
                                    <label for="jobDescription">Job Description *</label>
                                    <textarea id="jobDescription" class="form-textarea-box" style="min-height: 120px;" required></textarea>
                                </div>

                                <div class="form-group-item">
                                    <label for="eligibility">Eligibility / Qualification *</label>
                                    <textarea id="eligibility" class="form-textarea-box" required></textarea>
                                </div>

                                <div class="form-group-item">
                                    <label for="requiredSkills">Required Skills</label>
                                    <textarea id="requiredSkills" class="form-textarea-box"></textarea>
                                </div>

                                <div class="form-group-item">
                                    <label for="responsibilities">Responsibilities</label>
                                    <textarea id="responsibilities" class="form-textarea-box"></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Footer Action Buttons -->
                        <div class="form-actions-footer">
                            <a href="/admin/careers/index.html" class="btn-secondary-white">Cancel</a>
                            <button type="submit" class="btn-primary-blue">Update</button>
                        </div>
                    </form>
                </div>

            </main>
        </div>
    </div>

    <script>
        var careerId = null;

        document.addEventListener('DOMContentLoaded', function () {
            window.renderAdminLayout('careers', 'Edit Job Opening');

            var params = new URLSearchParams(window.location.search);
            careerId = params.get('id');

            if (!careerId) {
                alert('No career ID specified.');
                window.location.href = '/admin/careers/index.html';
                return;
            }

            loadCareerDetail();

            document.getElementById('editCareerForm').addEventListener('submit', async function (e) {
                e.preventDefault();

                var bodyObj = {
                    jobTitle: document.getElementById('jobTitle').value.trim(),
                    department: document.getElementById('department').value,
                    location: document.getElementById('location').value.trim(),
                    employmentType: document.getElementById('employmentType').value,
                    experienceRequired: document.getElementById('experienceRequired').value.trim(),
                    numberOfVacancies: parseInt(document.getElementById('numberOfVacancies').value) || 1,
                    applicationDeadline: document.getElementById('applicationDeadline').value || null,
                    isActive: document.getElementById('statusSelect').value === 'true',
                    jobDescription: document.getElementById('jobDescription').value.trim(),
                    eligibility: document.getElementById('eligibility').value.trim(),
                    requiredSkills: document.getElementById('requiredSkills').value.trim(),
                    responsibilities: document.getElementById('responsibilities').value.trim()
                };

                try {
                    var response = await fetch(window.TVSS_API.baseUrl + '/careers/' + careerId, {
                        method: 'PUT',
                        headers: window.TVSS_API.getHeaders(),
                        body: JSON.stringify(bodyObj)
                    });

                    if (!response.ok) {
                        var errData = await response.json();
                        throw new Error(errData.message || 'Failed to update job opening');
                    }

                    alert('Job opening updated successfully!');
                    window.location.href = '/admin/careers/index.html';
                } catch (err) {
                    alert('Error updating job opening: ' + err.message);
                }
            });
        });

        async function loadCareerDetail() {
            try {
                var response = await fetch(window.TVSS_API.baseUrl + '/careers/' + careerId, {
                    headers: window.TVSS_API.getHeaders()
                });

                if (!response.ok) throw new Error('Failed to fetch details');
                var data = await response.json();

                document.getElementById('jobTitle').value = data.jobTitle || '';
                document.getElementById('department').value = data.department || '';
                document.getElementById('location').value = data.location || '';
                document.getElementById('employmentType').value = data.employmentType || 'Full Time';
                document.getElementById('experienceRequired').value = data.experienceRequired || '';
                document.getElementById('numberOfVacancies').value = data.numberOfVacancies || 1;
                document.getElementById('applicationDeadline').value = data.applicationDeadline ? data.applicationDeadline.split('T')[0] : '';
                document.getElementById('statusSelect').value = data.isActive ? 'true' : 'false';

                document.getElementById('jobDescription').value = data.jobDescription || '';
                document.getElementById('eligibility').value = data.eligibility || '';
                document.getElementById('requiredSkills').value = data.requiredSkills || '';
                document.getElementById('responsibilities').value = data.responsibilities || '';

            } catch (err) {
                alert('Error loading detail: ' + err.message);
                window.location.href = '/admin/careers/index.html';
            }
        }
    </script>
</body>
</html>
